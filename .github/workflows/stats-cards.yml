name: Generate stats cards

on:
  # Uruchom automatycznie co 24 godziny
  schedule:
    - cron: "0 0 * * *"

  # Pozwala na ręczne uruchomienie z zakładki "Actions"
  workflow_dispatch:

  # Uruchom również przy każdym commicie w gałęzi głównej
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generuje karty statystyk GitHub (stats, języki, streak; jasne i ciemne) do dist/
      #    Akcja: https://github.com/spidero/github-stats-card
      - name: Generate stats cards
        uses: spidero/github-stats-card@v1
        with:
          github_user_name: spidero
          output_dir: dist
          cards: stats,languages,streak
          # Języki także z prywatnych repo (tylko nazwy i %, bez nazw repo)
          include_private: "true"
          # Personal token so private repos are counted too
          token: ${{ secrets.STATS_TOKEN }}

      # 2. Wrzuca wygenerowane pliki na gałąź "output" (zastępuje całą jej zawartość)
      - name: Push cards to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
