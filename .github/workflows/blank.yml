name: Generate Snake

on:
  # Uruchom automatycznie co 24 godziny
  schedule:
    - cron: "0 0 * * *"
  
  # Pozwala na ręczne uruchomienie z zakładki "Actions"
  workflow_dispatch:
    
  # Uruchom również przy każdym commicie w gałęzi głównej
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 0. Pobiera repo (skrypt statystyk); musi być przed generowaniem do dist/
      - name: Checkout
        uses: actions/checkout@v7

      # 1. Generuje animację węża w formacie SVG (wersja jasna i ciemna)
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: spidero
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Generuje własną kartę statystyk GitHub (jasna i ciemna) do dist/
      - name: Generate github-stats.svg
        run: python3 .github/scripts/github_stats.py spidero dist
        env:
          # Personal read-only token so private repos are counted too
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}

      # 3. Wrzuca wygenerowane pliki na osobną gałąź o nazwie "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          # Personal read-only token so private repos are counted too
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
