name: Generate Snake

on:
  # Uruchom automatycznie co 24 godziny
  schedule:
    - cron: "0 0 * * *"
  
  # Pozwala na ręczne uruchomienie z zakładki "Actions"
  workflow_dispatch:
    
  # Uruchom również przy każdym commicie w gałęzi głównej
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generuje animację węża w formacie SVG (wersja jasna i ciemna)
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: spidero
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Generuje karty statystyk GitHub (stats, języki, streak; jasne i ciemne) do dist/
      #    Akcja: https://github.com/spidero/github-stats-card
      - name: Generate stats cards
        uses: spidero/github-stats-card@v1
        with:
          github_user_name: spidero
          output_dir: dist
          cards: stats,languages,streak
          # Języki także z prywatnych repo (tylko nazwy i %, bez nazw repo)
          include_private: "true"
          # Personal token so private repos are counted too
          token: ${{ secrets.STATS_TOKEN }}

      # 3. Wrzuca wygenerowane pliki na osobną gałąź o nazwie "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
