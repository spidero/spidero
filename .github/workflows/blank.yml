name: Generate Snake

on:
  # Uruchom automatycznie co 24 godziny
  schedule:
    - cron: "0 0 * * *"
  
  # Pozwala na ręczne uruchomienie z zakładki "Actions"
  workflow_dispatch:
    
  # Uruchom również przy każdym commicie w gałęzi głównej
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generuje animację węża w formacie SVG (wersja jasna i ciemna)
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: spidero
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Wrzuca wygenerowane pliki na osobną gałąź o nazwie "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
